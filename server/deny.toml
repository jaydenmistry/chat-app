# cargo deny check: advisories, licenses, duplicate/banned crates, sources.

[graph]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound, yanked).
yanked = "deny"

[licenses]
# Permissive licenses only. Anything else needs a deliberate exception.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own workspace crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
